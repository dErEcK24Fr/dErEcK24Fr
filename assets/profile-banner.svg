<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Derecks — Full-Stack Developer</title>
<desc id="desc">Professional profile banner. Web applications, backend systems and cloud infrastructure, with a DS monogram and an interface to API to cloud diagram.</desc>
